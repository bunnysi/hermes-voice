[project]
name = "hermes-voice"
version = "0.2.0"
description = "Hermes plugin for full-duplex Fish Audio voice calls."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "hareai" }]
dependencies = [
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
only-include = [
  "__init__.py",
  "cli.py",
  "config.py",
  "fish_client.py",
  "server.py",
  "tools.py",
  "plugin.yaml",
  "SKILL.md",
  "config.example.yaml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
src = [".", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"server.py" = ["E501"]
